name: Deploy DEV

on:
  push:
    branches: [dev]
    paths:
      - 'flows/**'
      - 'environments/dev/config.yaml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Snowflake CLI
        uses: Snowflake-Labs/snowflake-cli-action@v1
        with:
          default-config-file-path: ''

      - name: Configure Snowflake connection
        run: |
          mkdir -p ~/.snowflake
          cat > ~/.snowflake/config.toml << 'EOF'
          [connections.default]
          account = "${{ vars.SNOWFLAKE_ACCOUNT }}"
          user = "${{ vars.SNOWFLAKE_USER }}"
          authenticator = "oauth"
          token = "${{ secrets.SNOWFLAKE_PAT }}"
          role = "${{ vars.SNOWFLAKE_ROLE }}"
          EOF

      - name: Install dependencies
        run: pip install -r scripts/cd/requirements-cd.txt

      - name: Run CD pipeline
        env:
          SNOWFLAKE_ACCOUNT_URL: ${{ vars.SNOWFLAKE_ACCOUNT_URL }}
          SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
          SNOWFLAKE_PAT: ${{ secrets.SNOWFLAKE_PAT }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
          NIFI_RUNTIME_PAT: ${{ secrets.NIFI_RUNTIME_PAT }}
          NIFIHUB_REGISTRY_PAT: ${{ secrets.NIFIHUB_REGISTRY_PAT }}
          GH_SECRETS_JSON: '{"NIFIHUB_REGISTRY_PAT":"${{ secrets.NIFIHUB_REGISTRY_PAT }}"}'
        run: python scripts/run-cd.py environments/dev/config.yaml
