name: Deploy PRD

on:
  push:
    branches: [prd]
    paths:
      - 'flows/**'
      - 'environments/prd/config.yaml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prd

    steps:
      - uses: actions/checkout@v7
        with:
          ref: prd
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Snowflake CLI and dependencies
        run: |
          pip install snowflake-cli
          pip install -r scripts/cd/requirements-cd.txt

      - name: Describe live state
        env:
          SNOWFLAKE_ACCOUNT_URL: ${{ vars.SNOWFLAKE_ACCOUNT_URL }}
          SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
          SNOWFLAKE_PAT: ${{ secrets.SNOWFLAKE_PAT }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
          NIFI_RUNTIME_PAT: ${{ secrets.NIFI_RUNTIME_PAT }}
        run: |
          cd scripts/cd
          python describe_live_state.py ../../environments/prd/config.yaml > /tmp/live-state.json

      - name: Compute diff
        env:
          SNOWFLAKE_ACCOUNT_URL: ${{ vars.SNOWFLAKE_ACCOUNT_URL }}
          SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
          SNOWFLAKE_PAT: ${{ secrets.SNOWFLAKE_PAT }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
          NIFI_RUNTIME_PAT: ${{ secrets.NIFI_RUNTIME_PAT }}
        run: |
          cd scripts/cd
          python diff_live.py /tmp/live-state.json ../../environments/prd/config.yaml > /tmp/live-diff.json
          python translate_live_diff.py /tmp/live-diff.json > /tmp/changes.json
          echo "--- Change Plan ---"
          cat /tmp/changes.json

      - name: Apply changes
        env:
          SNOWFLAKE_ACCOUNT_URL: ${{ vars.SNOWFLAKE_ACCOUNT_URL }}
          SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
          SNOWFLAKE_PAT: ${{ secrets.SNOWFLAKE_PAT }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
          NIFI_RUNTIME_PAT: ${{ secrets.NIFI_RUNTIME_PAT }}
          NIFIHUB_REGISTRY_PAT: ${{ secrets.NIFIHUB_REGISTRY_PAT }}
          GH_SECRETS_JSON: ${{ toJSON(secrets) }}
          GH_VARS_JSON: ${{ toJSON(vars) }}
        run: |
          cd scripts/cd
          python orchestrate.py /tmp/changes.json ../../environments/prd/config.yaml
